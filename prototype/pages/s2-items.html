<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>逛义卖 · IMNU 校园义卖</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="screen has-tabbar">
  <div class="topbar">
    <div class="statusbar"><span>9:41</span><span>5G ▮▮▮ 100%</span></div>
    <div class="navbar">
      <div class="title">IMNU 校园义卖</div>
      <div class="capsule"><i>•••</i><i>⊙</i></div>
    </div>
  </div>

  <div class="body">
    <div class="searchrow">
      <div class="logo-sq">🎪</div>
      <div class="searchbar">
        <span class="ico">🔍</span>
        <input id="q" type="search" placeholder="搜索义卖物品">
      </div>
    </div>

    <div class="panel" style="margin-top:0;padding:13px 16px">
      <p style="margin:0;font-size:12.5px">📅 <b id="ev-date"></b> &nbsp;|&nbsp; 📍 <b id="ev-place"></b></p>
    </div>

    <div class="segmented" id="stall-tabs">
      <button class="on" data-stall="all">全部</button>
      <button data-stall="st1">一号</button>
      <button data-stall="st2">二号</button>
      <button data-stall="st3">三号</button>
    </div>

    <div class="grid2" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      <div class="ic">🧺</div>
      <div class="t">没有找到符合条件的物品</div>
    </div>

    <div class="panel">
      <h3>取货须知</h3>
      <p><b>预定：</b>免费登记，仅锁定名额，不收取任何费用。</p>
      <p><b>取货：</b><span id="ev-date2"></span>，凭取货码到对应摊位。</p>
      <p><b>付款：</b>现场付款由摊位负责，小程序不参与任何交易。</p>
      <p><b class="g">取消：</b>无法到场请提前取消，把名额让给其他同学。</p>
    </div>
  </div>

  <nav class="tabbar">
    <a class="on" href="s2-items.html">逛义卖</a>
    <a href="s6-my-reservations.html">我的预定</a>
    <a href="s8-profile.html">我的</a>
  </nav>
</div>

<script src="../assets/data.js"></script>
<script src="../assets/app.js"></script>
<script>
  document.getElementById('ev-date').textContent = BZ.EVENT.date;
  document.getElementById('ev-date2').textContent = BZ.EVENT.date;
  document.getElementById('ev-place').textContent = BZ.EVENT.place;

  let curStall = 'all';
  let curQ = '';

  function quotaHtml(it) {
    const left = it.remaining;
    const cls = left === 0 ? 'none' : (left / it.total <= 0.3 ? 'low' : '');
    const pct = Math.round((left / it.total) * 100);
    const label = left === 0
      ? '<b class="none">已约满</b>'
      : `还剩 <b class="${cls}">${left}</b> / ${it.total}`;
    return `<div class="quota">
        <div class="qt"><span>名额</span><span>${label}</span></div>
        <div class="qbar ${cls}"><i style="width:${pct}%"></i></div>
      </div>`;
  }

  function cardHtml(it) {
    const out = it.remaining === 0;
    const tags = (it.tags || []).slice(0, 1)
      .map((t) => `<span class="tag grey">${t}</span>`).join('');
    return `<button class="item-card ${out ? 'is-out' : ''}" data-id="${it.id}">
        <div class="thumb ${it.tint}">
          ${it.emoji}
          ${out ? '<div class="badge-soldout"><span>已约满</span></div>' : ''}
        </div>
        <div class="name">${it.name}</div>
        <div class="stall">${BZ.stallName(it.stall)} · ${tags}</div>
        ${quotaHtml(it)}
      </button>`;
  }

  function render() {
    const list = BZ.items().filter((it) => {
      if (curStall !== 'all' && it.stall !== curStall) return false;
      if (curQ && it.name.indexOf(curQ) === -1) return false;
      return true;
    });
    document.getElementById('grid').innerHTML = list.map(cardHtml).join('');
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  }

  document.getElementById('grid').addEventListener('click', (e) => {
    const card = e.target.closest('.item-card');
    if (card) location.href = 's3-item-detail.html?id=' + card.dataset.id;
  });

  document.getElementById('stall-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#stall-tabs button').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    curStall = b.dataset.stall;
    render();
  });

  document.getElementById('q').addEventListener('input', (e) => {
    curQ = e.target.value.trim();
    render();
  });

  render();
</script>
</body>
</html>
