# ============================================================
# IMNU 校园义卖 · nginx 站点配置
# ============================================================
#
# 为什么这里只有 HTTP（80）的配置，没有 443：
#   证书在你跑 certbot 之前并不存在，提前写上 ssl_certificate
#   会让 `nginx -t` 直接失败，自己也容易看懵。
#
# 正确顺序：
#   1. 把下面所有 YOUR_DOMAIN 换成你的域名
#   2. 放到 /etc/nginx/sites-available/bazaar
#      并软链： ln -s /etc/nginx/sites-available/bazaar /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. sudo certbot --nginx -d YOUR_DOMAIN
#      certbot 会自动补上 443 的 server 块和证书配置，不用手工写
# ============================================================

# ------------------------------------------------------------
# 限流区（http 级，所以写在 server 块外面）
#
# ★ 为什么数字取得这么宽：**校园网是 NAT**，几百个同学可能共用一个出口 IP。
#   按 IP 限速时，这个 IP 代表的是「一整栋楼」，不是一个人。
#   所以这里的目标不是"精确控速"，而是**挡住明显的脚本猛打**：
#     · api_all  —— 一般的读接口。30 r/s + 突发 60，正常刷页面远到不了
#     · api_auth —— 登录 / 注册。一个人一辈子点一次，2 r/s 足够；
#                   这条才是真正挡「拿脚本刷 openid 换额度」的
#   设得太紧会在活动开放那一秒误伤一大片，那比被刷更糟。
# ------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_all:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name neishidemao.cn www.neishidemao.cn;

    # 根路径要有一个正经页面，不能返回 404。
    #
    # 备案通过之后，管局和阿里云是会抽查的。如果 http://域名/ 是 404，
    # 可能被判定为「备案信息与实际提供的服务不符」，严重的话备案会被注销。
    #
    # 所以这里放一个说明页（deploy/www/index.html，由 bootstrap.sh 装过去）。
    # 内容要和备案时填的服务内容对得上。
    location / {
        root /srv/bazaar/www;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
        proxy_send_timeout   30s;

        # 义卖当天是短时高并发，别把请求缓冲住
        proxy_buffering off;

        # 一般读接口的限速。burst 给足，正常的「进页面拉三四次」不会碰到。
        limit_req zone=api_all burst=60 nodelay;
    }

    # 登录 / 注册：一个人一辈子点一次，这里可以卡得紧。
    # ★ 这才是挡「拿脚本反复调 /api/login 换 openid」的那道闸 ——
    #   每次登录服务端都要去微信换一次，被刷起来既耗 CPU 也耗调用额度。
    location = /api/login {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    location = /api/register {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # 这个 /health 由 nginx 自己应答，用来区分
    # 「nginx 挂了」和「Node 服务挂了」——排障时能省很多时间。
    # 应用本身的健康检查在 /api/health。
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"ok":true,"service":"bazaar-nginx"}';
    }

    # 物品照片。★ 交给 nginx 直接发文件，不要 proxy 到 Node ——
    #   图片是静态的，让 Node 读进内存再吐出去纯属浪费，而且会占住
    #   那个单线程；义卖当天几十个人同时刷列表时差别很明显。
    #
    #   ★ 这里的 root 和 service 里 ReadWritePaths 的 /srv/bazaar/images
    #     必须是同一个目录；tests/deploy.test.mjs 会比对这两处。
    #
    #   文件名里带随机串、内容永不改变（换图是换一个新文件名），
    #   所以可以放心让客户端长期缓存。
    #
    #   注意这里**不写 try_files** —— try_files 和 alias 一起用是有名的坑
    #   （$uri 带着 /images/ 前缀，会和 alias 再拼一次）。缺文件时
    #   nginx 本来就会 404，不需要额外兜。
    location /images/ {
        alias /srv/bazaar/images/;
        access_log off;
        expires 30d;
        add_header X-Content-Type-Options nosniff;
    }

    # 上传接口的 body 是 base64 的图片，会明显超过 1m。
    # ★ 这个值必须**大于**应用自己的上限（server/images.mjs 的 2MB 解码后
    #   约 2.8MB base64）：反过来的话，超限请求会被 nginx 用一个 HTML 的
    #   413 页面挡掉，小程序那边只能显示「网络错误」，看不出是图太大。
    #   让应用先接住，才能给出「图片不能超过 2048KB」这句人话。
    client_max_body_size 4m;

    access_log /var/log/nginx/bazaar.access.log;
    error_log  /var/log/nginx/bazaar.error.log;
}
